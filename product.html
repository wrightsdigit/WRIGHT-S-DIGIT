<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WRIGHT'S DIGIT | Products Catalog</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>

  <!-- PRODUCT PAGE NAVBAR -->
 <header class="products-header">
  <div class="container nav-wrapper">
    <!-- Left: Logo and Brand Name side-by-side -->
    <a href="index.html" class="brand-group">
      <img src="logo.png" alt="WRIGHT'S DIGIT Logo" class="nav-logo" onerror="this.style.display='none'">
      <span class="brand-link">WRIGHT'S DIGIT</span>
    </a>
  </div>
</header>

   <div class="order-trigger-container" style="text-align: center; margin: 40px 0;">
  <button type="button" onclick="openEmbroideryModal()" class="btn btn-primary btn-large">
    PLACE FREE EMBROIDERY DIGITIZING ORDER
  </button>
</div>
  <!-- PRODUCTS GRID -->
  <main class="section">
    <div class="container">
      <h1 class="page-title">What We Provide</h1>
      <div id="product-grid" class="product-grid"></div>
    </div>
  </main>

  <!-- MULTI-IMAGE & DETAIL POPUP MODAL -->
  <div id="product-detail-modal" class="modal">
    <div class="modal-content product-modal-content">
      <span class="close-btn" onclick="closeModal('product-detail-modal')">&times;</span>
      
      <!-- Image Gallery Carousel -->
      <div class="gallery-container">
        <img id="modal-main-img" src="" alt="Product Image" class="gallery-main-img">
        <div id="modal-thumbnails" class="thumbnail-list"></div>
      </div>

      <!-- Details -->
      <div class="product-info-panel">
        <h2 id="modal-product-title"></h2>
        <div class="price-row">
          <span id="modal-product-price" class="modal-price"></span>
          <button class="btn btn-outline" id="modal-like-btn"><i data-feather="heart"></i> <span id="modal-likes-count"></span></button>
        </div>
        
        <p id="modal-product-desc"></p>

        <!-- Customer Reviews List -->
        <div class="reviews-container">
          <h3>REVIEWS</h3>
          <div id="modal-reviews-list"></div>
        </div>

        <button class="btn btn-primary full-width" id="trigger-order-btn">ORDER NOW</button>
      </div>
    </div>
  </div>

  <!-- ORDER FORM MODAL -->
  <div id="order-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('order-modal')">&times;</span>
      <h3>COMPLETE YOUR ORDER</h3>
      <p id="order-product-subtitle" class="order-subtitle"></p>

      <!-- Formspree Integration -->
      <form id="order-form" class="order-form">
        <input type="hidden" id="order-item-name" name="ordered_product">
        
        <label>FULL NAME</label>
        <input type="text" name="customer_name" required placeholder="John Doe">

        <label>EMAIL ADDRESS</label>
        <input type="email" name="customer_email" required placeholder="john@example.com">

        <label>PAYMENT METHOD</label>
        <select name="payment_method" required>
          <option value="">-- Select Payment Method --</option>
          <option value="Credit/Debit Card">Credit / Debit Card</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="EasyPaisa / JazzCash">EasyPaisa / JazzCash</option>
          <option value="PayPal">PayPal</option>
        </select>

        <button type="submit" class="btn btn-primary full-width">CONFIRM ORDER</button>
      </form>
    </div>
  </div>

  <!-- EMBROIDERY DIGITIZING ORDER MODAL -->
<div id="embroidery-modal" class="modal-overlay">
  <div class="modal-content form-modal">
    <button type="button" class="close-btn" onclick="closeEmbroideryModal()">&times;</button>
    <h2>PLACE FREE EMBROIDERY DIGITIZING ORDER</h2>

    <form id="embroidery-order-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" enctype="multipart/form-data">
      
      <!-- Customer Info -->
      <div class="form-group">
        <label for="cust-name">Full Name *</label>
        <input type="text" id="cust-name" name="Full Name" required placeholder="Enter your full name">
      </div>

      <div class="form-group">
        <label for="cust-email">Email Address *</label>
        <input type="email" id="cust-email" name="Email Address" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="cust-phone">Phone Number *</label>
        <input type="tel" id="cust-phone" name="Phone Number" required placeholder="+1 123 456 7890">
      </div>

      <div class="form-group">
        <label for="cust-company">Company Name</label>
        <input type="text" id="cust-company" name="Company Name" placeholder="Your company or business name">
      </div>

      <!-- Dimensions -->
      <div class="form-row">
        <div class="form-group half-width">
          <label for="cust-width">Width (Inches/cm) *</label>
          <input type="text" id="cust-width" name="Design Width" required placeholder="e.g., 4 in">
        </div>
        <div class="form-group half-width">
          <label for="cust-height">Height (Inches/cm) *</label>
          <input type="text" id="cust-height" name="Design Height" required placeholder="e.g., 3 in">
        </div>
      </div>

      <!-- Format Radio Options -->
      <div class="form-group">
        <label>File Format Required *</label>
        <div class="format-options">
          <label><input type="radio" name="Required File Format" value="PES" required> PES</label>
          <label><input type="radio" name="Required File Format" value="DST"> DST</label>
          <label><input type="radio" name="Required File Format" value="EPS"> EPS</label>
          <label><input type="radio" name="Required File Format" value="AI"> AI</label>
          <label><input type="radio" name="Required File Format" value="CDR"> CDR</label>
        </div>
      </div>

      <!-- Placement & Message -->
      <div class="form-group">
        <label for="cust-placement">Placement *</label>
        <input type="text" id="cust-placement" name="Placement Location" required placeholder="e.g., Left Chest, Hat / Cap, Back of Jacket">
      </div>

      <div class="form-group">
        <label for="cust-message">Order Instructions / Message</label>
        <textarea id="cust-message" name="Special Instructions" rows="3" placeholder="Add thread color specs, garment details, or specific notes..."></textarea>
      </div>

      <!-- File Upload (Triggers Device Storage / Library) -->
      <div class="form-group">
        <label for="cust-file">Upload Artwork / Image *</label>
        <input type="file" id="cust-file" name="Artwork File" required accept="image/*, .pdf, .ai, .eps, .psd, .cdr">
        <small class="help-text">Choose file from your phone library or desktop.</small>
      </div>

      <button type="submit" class="btn btn-primary submit-btn">SUBMIT ORDER TO GMAIL</button>
    </form>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
